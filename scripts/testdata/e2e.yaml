apiVersion: v1
kind: Namespace
metadata:
  name: dumpall-e2e
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: dumpall-e2e
data:
  greeting: hello
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: dumpall-e2e
spec:
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: dumpall-e2e
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources:
            limits:
              memory: 64Mi
