name: Auto Release

on:
  push:
    branches: [main]
  schedule:
    # Every 6 hours — catches unreleased commits if push event was missed
    - cron: '0 */6 * * *'

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Check if HEAD needs a release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use --list 'v*' so a non-version tag (e.g. 'latest') never suppresses a release
          CURRENT_TAG=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -1)
          if [ -n "$CURRENT_TAG" ]; then
            # HEAD is tagged — check if the GitHub Release also exists
            if gh release view "$CURRENT_TAG" > /dev/null 2>&1; then
              echo "new_release=false" >> "$GITHUB_OUTPUT"
            else
              # Tag exists but release is missing — recover by creating the release
              echo "new_release=true" >> "$GITHUB_OUTPUT"
              echo "new_tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
            fi
          else
            # HEAD is untagged — every merge to main bumps the minor version.
            # A patch or major release is tagged by hand (the tag on HEAD
            # makes this job create the release, see above).
            # Pre-release tags (v1.2.0-rc.1) do not count.
            LATEST=$(git describe --tags --abbrev=0 --match 'v*' --exclude 'v*-*' 2>/dev/null || echo 'v0.0.0')
            MAJOR=$(echo "$LATEST" | cut -d. -f1 | tr -d 'v')
            MINOR=$(echo "$LATEST" | cut -d. -f2)
            NEW_TAG="v${MAJOR}.$((MINOR + 1)).0"
            echo "new_release=true" >> "$GITHUB_OUTPUT"
            echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Push tag
        if: steps.check.outputs.new_release == 'true'
        run: |
          NEW_TAG="${{ steps.check.outputs.new_tag }}"
          # Skip if the tag already exists locally (recovery: tag was pushed in a prior failed run)
          if git tag --list "$NEW_TAG" | grep -q .; then
            echo "Tag $NEW_TAG already exists, skipping push"
          else
            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"
          fi

      - name: Build binaries
        if: steps.check.outputs.new_release == 'true'
        run: |
          # HEAD is now at the release tag, go build embeds the version. Build
          # outside the checkout: files in it would mark the version +dirty.
          dist=$RUNNER_TEMP/dist
          mkdir -p "$dist"
          GOOS=linux   GOARCH=amd64 go build -trimpath -o "$dist/dumpall-linux-amd64"   .
          GOOS=linux   GOARCH=arm64 go build -trimpath -o "$dist/dumpall-linux-arm64"   .
          GOOS=darwin  GOARCH=amd64 go build -trimpath -o "$dist/dumpall-darwin-amd64"  .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -o "$dist/dumpall-darwin-arm64"  .
          GOOS=windows GOARCH=amd64 go build -trimpath -o "$dist/dumpall-windows-amd64.exe" .

      - name: Generate checksums
        if: steps.check.outputs.new_release == 'true'
        run: cd "$RUNNER_TEMP/dist" && sha256sum dumpall-* > checksums.txt

      - name: Create GitHub Release
        if: steps.check.outputs.new_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.check.outputs.new_tag }}" \
            --title "${{ steps.check.outputs.new_tag }}" \
            --generate-notes \
            "$RUNNER_TEMP"/dist/*
