name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Installs prek and betterleaks from mise.toml (same versions as locally).
      - uses: jdx/mise-action@v5

      - name: Run prek
        # Fails if a hook changed files (go mod tidy, usage.md, README).
        run: prek run --all-files --show-diff-on-failure

      - name: Test with race detector
        run: go test -race ./...

  e2e:
    # dumpall against a real kube-apiserver (envtest binaries, no container
    # runtime needed), output checked with kubenorm.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: End-to-end test
        run: scripts/e2e.sh
